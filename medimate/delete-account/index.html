        <div style="font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; line-height: 1.6; color: #1e293b;">
          <h1 style="color: #0f172a;">MediMate — Account &amp; Data Deletion Request</h1>
          <p><strong>Part of EasyFlow Technologies</strong></p>
          <p>At MediMate, we respect your privacy and provide users with a straightforward way to request deletion of their account and associated data.</p>
          <h2>How to Request Deletion</h2>
          <ol>
            <li>Open your email application.</li>
            <li>Send an email to: <a href="mailto:support.easyflow@gmail.com?subject=MediMate%20Account%20%26%20Data%20Deletion%20Request">support.easyflow@gmail.com</a></li>
            <li>Use the subject: <strong>MediMate Account &amp; Data Deletion Request</strong></li>
            <li>Include your registered MediMate email address or account username. Please do not send your password or authentication codes.</li>
          </ol>
          <h2>What can be deleted?</h2>
          <p>Upon receiving your request, the MediMate support team will review the request and process deletion of the account and associated data that is eligible for deletion in accordance with applicable requirements and MediMate's data practices.</p>
          <h2>Account Ownership Verification</h2>
          <p>For your protection, we may need to verify account ownership before processing a deletion request. Please do not include your password or authentication codes in your request.</p>
          <h2>Processing Information</h2>
          <p>Your request is received by the EasyFlow support team. The request may be reviewed to verify account ownership. Eligible account and associated data will be processed for deletion. The support team may contact you if additional information is required.</p>
          <p><a href="mailto:support.easyflow@gmail.com?subject=MediMate%20Account%20%26%20Data%20Deletion%20Request" style="display: inline-block; background-color: #046E86; color: white; padding: 12px 24px; text-decoration: none; border-radius: 8px; font-weight: bold;">Request Account Deletion</a></p>
