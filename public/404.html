<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | EasyFlow</title>
    <script>
      // Single Page App routing & subpath fallback for GitHub Pages
      (function() {
        var path = window.location.pathname.toLowerCase();
        var segments = window.location.pathname.split('/').filter(Boolean);
        var isRepoSubpath = segments[0] === 'easyflow-website';
        var prefix = isRepoSubpath ? '/easyflow-website' : '';

        // PromptFlow routes
        if (path.indexOf('promptflow') !== -1) {
          if (path.indexOf('privacy-policy') !== -1) {
            window.location.replace(prefix + '/promptflow/privacy-policy/');
            return;
          }
          window.location.replace(prefix + '/promptflow/');
          return;
        }

        // Spendora routes
        if (path.indexOf('spendora') !== -1) {
          if (path.indexOf('delete-account') !== -1) {
            window.location.replace(prefix + '/spendora/delete-account/');
            return;
          }
          if (path.indexOf('privacy-policy') !== -1) {
            window.location.replace(prefix + '/spendora/privacy-policy/');
            return;
          }
        }

        // MediMate routes
        if (path.indexOf('delete-account') !== -1) {
          window.location.replace(prefix + '/medimate/delete-account/');
          return;
        }
        if (path.indexOf('privacy-policy') !== -1) {
          window.location.replace(prefix + '/medimate/privacy-policy/');
          return;
        }
      })();
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        text-align: center;
      }
      .card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        padding: 40px;
        border-radius: 24px;
        box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06), inset 0 1px 0 0 rgba(255, 255, 255, 0.9);
        max-width: 480px;
        border: 1px solid rgba(226, 232, 240, 0.85);
      }
      h1 { font-size: 26px; font-weight: 800; margin-bottom: 12px; color: #1D4ED8; letter-spacing: -0.02em; }
      p { color: #64748b; font-size: 15px; margin-bottom: 28px; line-height: 1.6; }
      .btn {
        display: inline-block;
        background: #1D4ED8;
        color: white;
        padding: 12px 28px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        box-shadow: 0 4px 14px 0 rgba(29, 78, 216, 0.25);
        transition: all 0.2s ease;
      }
      .btn:hover {
        background: #2563EB;
        transform: translateY(-1px);
        box-shadow: 0 6px 20px 0 rgba(29, 78, 216, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Page Not Found</h1>
      <p>The page you are looking for may have moved or doesn't exist.</p>
      <a href="./" class="btn">Return to EasyFlow Home</a>
    </div>
  </body>
</html>
