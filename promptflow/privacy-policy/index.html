        <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 24px; line-height: 1.6; color: #1e293b;">
          <h1 style="color: #008B8B; font-size: 28px; margin-bottom: 8px;">PromptFlow Privacy Policy</h1>
          <p><strong>Developed and Operated by EasyFlow Technologies</strong></p>
          <p><em>Effective Date: November 2, 2026 | Last Updated: November 2, 2026</em></p>
          <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;" />

          <p>Your privacy matters to us. PromptFlow is designed with a privacy-first philosophy, giving you control over your prompts, projects, and personal data.</p>
          <p>This Privacy Policy explains what information PromptFlow handles, how it is stored, and how we protect your privacy when you use our software.</p>

          <h2>1. Information We Collect</h2>
          <p>PromptFlow is designed to operate locally on your device. We do not intentionally collect, upload, or store your:</p>
          <ul>
            <li>Prompts and written content.</li>
            <li>Personal projects and workspace files.</li>
            <li>Editing history and locally stored prompt data.</li>
            <li>Private notes and user-created content.</li>
            <li>Personal information through a mandatory account system.</li>
          </ul>
          <p>PromptFlow does not require users to create an account to access its core functionality.</p>

          <h2>2. Local Data Storage</h2>
          <p>PromptFlow operates on a transparent local-first storage architecture:</p>
          <ul>
            <li><strong>User Filesystem Storage:</strong> Prompts, diagrams, and projects are saved directly to your local computer's filesystem in folders designated by you.</li>
            <li><strong>SQLite Technology:</strong> PromptFlow uses local storage technology, including embedded SQLite (promptflow_metadata.db), strictly to manage application preferences, UI settings, and recent project paths.</li>
          </ul>
          <p>This means your prompt data remains under your control, your workspace does not depend on cloud synchronization, and your content is not automatically shared with EasyFlow.</p>

          <h2>3. Artificial Intelligence and External Services</h2>
          <p>PromptFlow includes locally implemented intelligence features, including handcrafted autocomplete intelligence, intelligent spelling correction, and deterministic Test Lab rubric scoring. These features are designed to operate within the application without requiring external AI API providers. PromptFlow does not automatically transmit your prompts to external AI providers.</p>

          <h2>4. Internet Connectivity</h2>
          <p>PromptFlow is designed primarily as an offline-capable desktop application. Certain operations, if introduced or enabled in future versions, may require an internet connection, such as downloading software updates.</p>

          <h2>5. Data Sharing and Third Parties</h2>
          <p>EasyFlow does not sell, rent, or trade users' private prompt content or personal project data. We do not intentionally share locally stored prompt content with advertisers, analytics companies, or other third parties.</p>

          <h2>6. Data Security</h2>
          <p>We prioritize privacy-conscious software architecture and local data management. Users are responsible for maintaining appropriate device security, protecting access to their computers, and backing up important files.</p>

          <h2>7. Children's Privacy</h2>
          <p>PromptFlow is not specifically designed to collect personal information from children.</p>

          <h2>8. Your Privacy Rights</h2>
          <p>You maintain control over your locally stored information. You can access, modify, delete your content, or remove locally stored application data at any time.</p>

          <h2>9. Changes to This Privacy Policy</h2>
          <p>We may update this Privacy Policy when PromptFlow introduces new features or changes to data-handling practices.</p>
