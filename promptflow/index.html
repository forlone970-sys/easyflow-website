          <p>
            Not just another prompt editor. PromptFlow is where ideas evolve into precision. Create, refine, test, and master your prompts with an intelligent workspace built for the next generation of AI creators. Featuring handcrafted autocomplete intelligence, intelligent spelling correction, and a powerful developer-inspired environment, PromptFlow transforms the way you interact with AI.
          </p>

          <h2>Core Capabilities</h2>
          <ul>
            <li><strong>Monaco-Powered Prompt Editor:</strong> Token estimation heuristic (~4 chars/token), Mustache variable parameters ({{variable}}), and live parameter extraction.</li>
            <li><strong>Handcrafted Autocomplete Intelligence:</strong> Zero-latency ghost-text completions for parameters and structured Markdown envelopes.</li>
            <li><strong>Intelligent Spelling Correction:</strong> Embedded English vocabulary with Alt+Enter quick fixes that preserves code blocks and syntax tokens.</li>
            <li><strong>Deterministic 100-Point Test Lab:</strong> Offline 7-criterion rubric scoring drafts across Role, Constraints, Exemplars, Schema, Parameterization, Structure, and Token Efficiency.</li>
            <li><strong>Visual Workflow Diagram Designer:</strong> React Flow interactive node graph persisted as canonical .diagram JSON.</li>
            <li><strong>Bundled Offline Templates:</strong> 5 functional categories spanning System Personas, Few-Shot Tasks, Structured Output, Chain-of-Thought, and Guardrails.</li>
            <li><strong>100% Local Data Sovereignty:</strong> Zero telemetry, zero external AI proxies, user filesystem prompt storage, and embedded SQLite metadata.</li>
          </ul>

          <h2>Windows Compatibility</h2>
          <p>PromptFlow is a native desktop application designed for 64-bit Windows 10 and Windows 11.</p>
