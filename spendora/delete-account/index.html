          <h1 style="color: #0f172a;">Spendora — Account &amp; Data Deletion Request</h1>
          <p><strong>Operated by EasyFlow Technologies</strong></p>
          <p>Spendora provides full data ownership and sovereignty. You can delete your account and all associated cloud financial data at any time.</p>
          
          <h2>Method 1: Instant In-App Deletion (Recommended)</h2>
          <ol>
            <li>Launch the Spendora app on your Android device.</li>
            <li>Tap the <strong>Profile / Settings</strong> tab.</li>
            <li>Select <strong>Account Security</strong> and tap <strong>Delete Account</strong>.</li>
            <li>Re-authenticate with Google Sign-In or your password when prompted to verify ownership.</li>
            <li>Confirm deletion. Your account, authentication credentials, and all synchronized cloud Firestore entries (shopping sprees, itemized records, receipt entries) will be permanently purged immediately.</li>
          </ol>

          <h2>Method 2: Web &amp; Email Deletion Request Portal</h2>
          <p>If you have uninstalled the app or cannot access your device, submit a manual deletion request:</p>
          <ol>
            <li>Open your email application.</li>
            <li>Send an email to: <a href="mailto:support.easyflow@gmail.com?subject=Spendora%20Account%20%26%20Data%20Deletion%20Request">support.easyflow@gmail.com</a></li>
            <li>Subject line: <strong>Spendora Account &amp; Data Deletion Request</strong></li>
            <li>Include your registered Spendora email address or Google Sign-In address. Please do not send passwords or credentials.</li>
          </ol>

          <h2>What Happens to Your Data?</h2>
          <ul>
            <li><strong>Cloud Firestore:</strong> All user records under <code>users/{uid}/...</code> are permanently deleted.</li>
            <li><strong>Firebase Authentication:</strong> The account record and authentication tokens are revoked and destroyed.</li>
            <li><strong>Local SQLite Database:</strong> Stored on your device; uninstalling the app or clearing app storage clears the local database completely.</li>
          </ul>

          <h2>Processing Timeline</h2>
          <p>Manual web requests are verified and processed within 24–48 business hours. You will receive an email confirmation once the purge is complete.</p>
